<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amar Arefeen</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(to bottom right, #e0f7fa, #fff3e0);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0 10px 0;
    }
    .header h1 {
      font-size: 4rem;
      color: #004d40;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .flag {
      font-size: 3rem;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .plane-emoji {
      font-size: 5rem;
      margin-bottom: 30px;
      animation: fly 2s ease-in-out infinite alternate;
    }
    @keyframes fly {
      0% { transform: translateX(0) translateY(0); }
      100% { transform: translateX(25px) translateY(-15px); }
    }
    .button {
      font-size: 2rem;
      padding: 1.2rem 2.5rem;
      background-color: #0288d1;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .button:hover {
      background-color: #01579b;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="flag">🗽</div>
    <h1>Amar Arefeen</h1>
    <div class="flag">🇨🇦</div>
  </div>
  <div class="content">
    <div class="plane-emoji">✈️</div>
    <button class="button" onclick="window.location.href='https://amararefeen.com/nyctouchdown/'">Track my friends</button>
  </div>
</body>
</html>
